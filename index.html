<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Training</title>

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="homepage">

    <!-- Full-screen Hero Video -->
    <section class="hero-fullscreen">
        <video
            id="heroVideo"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            disablepictureinpicture
            x-webkit-airplay="deny"
            poster="assets/images/hero-still.jpg"
        >
            <source src="https://vz-3f73a609-be6.b-cdn.net/62552df7-25cc-46fa-990d-a1604c7b5c1b/play_1080p.mp4" type="video/mp4">
        </video>

        <!-- Centered Overlay -->
        <div class="signup-overlay">
            <form id="signupForm" class="signup-form">
                <input
                    type="email"
                    id="emailInput"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >
                <button type="submit" id="submitBtn">Enter</button>
            </form>
            <p id="formMessage" class="form-message"></p>
        </div>
    </section>

    <script src="js/homepage.js"></script>
</body>
</html>
